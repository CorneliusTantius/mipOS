# =====================================================================
#  monarch build configuration (Arch Linux edition)
#  One file with every decision. The scripts in scripts/ read it.
#  Format: NAME="value"   (lines starting with # are notes)
#
#  Every NAME="value" line below is a real switch: the scripts read it.
#  Fixed decisions (not switches, nothing reads them) are listed at the end.
# =====================================================================

# --- Identity --------------------------------------------------------
DISTRO_NAME="monarch"
DISTRO_ID="monarch"              # lower case, used for file names and the ISO
DISTRO_VERSION="0.3"
DISTRO_URL="https://github.com/CorneliusTantius/monarch"

# --- Base ------------------------------------------------------------
ARCH="x86_64"                  # used for file names and the package list (packages.x86_64)

# --- Live ISO ---------------------------------------------------
KERNEL="linux"                 # Arch's stock kernel; trimmed by the keep lists (see Hardware)
LIVE_HOSTNAME="monarch"
# Live system image compression. xz: ~10% smaller ISO, the live system
# starts a bit slower (zstd: faster, bigger). The installed system is not affected.
SQUASHFS_COMPRESSION="xz"
SQUASHFS_LEVEL="19"            # only used with zstd

# --- Desktop (optional add-on) --------------------------------------------------
DESKTOP_PACKAGES="mangowm waybar foot fuzzel mako libnotify grim slurp wl-clipboard brightnessctl pipewire pipewire-pulse pipewire-alsa wireplumber wiremix impala bluetui udisks2 udiskie ttf-jetbrains-mono ttf-dejavu noto-fonts noto-fonts-cjk noto-fonts-emoji ttf-nerd-fonts-symbols otf-font-awesome"  # monarch-add-desktop installs these (official repos only; needs internet). The noto/cjk/emoji fonts cover every script; the nerd/awesome fonts are icons.

# --- Disk (installer) -----------------------------------------
EFI_SIZE_MB="1024"             # EFI partition, mounted at /boot (kernel lives here)
BTRFS_MOUNT_OPTIONS="noatime,compress=zstd:1"
BTRFS_SUBVOLUMES="@ @home @var_log @var_cache @swap"   # no snapshots
ENCRYPTION="ask"               # LUKS2 (argon2id) for root, the installer asks yes/no
USER_GROUPS="wheel"            # wheel = may use sudo

# --- Lightweight tuning -----------------------------------------
KERNEL_CMDLINE_EXTRA="quiet loglevel=3 nowatchdog zswap.enabled=0"
LIVE_KERNEL_PARAMS="${KERNEL_CMDLINE_EXTRA}"   # the live ISO uses them too
ZRAM_SIZE_PERCENT="50"
ZRAM_COMPRESSION="zstd"
JOURNAL_MAX_SIZE="50M"
SERVICE_STOP_TIMEOUT="10s"

# --- Hardware --------------------------------------------------------
# Built for one laptop: ThinkPad L14 Gen 5 (21L2), Intel Core Ultra 5 135U.
# Only this laptop's drivers and firmware are kept (plus USB sticks, disk
# encryption, VM testing, webcam, phone tethering, USB sound, NTFS). Lists:
#   archiso/airootfs/etc/monarch/keep-modules    driver names
#   archiso/airootfs/etc/monarch/keep-firmware   firmware file patterns
# Applied by /usr/local/sbin/monarch-trim-hardware (pacman hook) after every
# kernel/firmware install or update, on the live and installed system.

# --- Size -------------------------------------------------------
STRIP_DOCS="yes"               # pacman NoExtract rules on/off: docs, man, info,
                               # C headers, static libraries, most terminfo (translations are kept)
# The rules: archiso/airootfs/etc/pacman.d/monarch-noextract.conf
# Firmware files this laptop loads at start (from its kernel log); checked too:
MUST_HAVE_FIRMWARE="i915/mtl_dmc.bin i915/mtl_guc_70.bin i915/mtl_huc_gsc.bin i915/mtl_gsc_1.bin intel/ibt-0180-0041.sfi iwlwifi-ma-b0-gf-a0-89.ucode intel/sof-ipc4/mtl/sof-mtl.ri intel/sof-ipc4-tplg/sof-hda-generic-2ch.tplg intel-ucode/06-aa-04"
# Drivers that must still load after trimming (checked by scripts/25-check-modules.sh):
MUST_HAVE_MODULES="i915 iwlwifi iwlmvm des_generic algif_skcipher algif_hash cmac ccm gcm btusb btintel snd_sof_pci_intel_mtl snd_hda_codec_conexant snd_hda_codec_intelhdmi thinkpad_acpi intel_hid e1000e nvme intel_lpss_pci i2c_hid_acpi hid_multitouch psmouse thunderbolt ucsi_acpi typec_displayport processor_thermal_device_pci int3400_thermal intel_rapl_msr coretemp pinctrl_meteorlake video dm_crypt dm_integrity zram squashfs isofs overlay loop usb_storage uas sr_mod vfat ntfs3 exfat virtio_net virtio_blk virtio_scsi virtio_gpu uvcvideo cdc_ncm rndis_host ipheth r8152 snd_usb_audio btrfs xhci_pci ahci usbhid hid_generic"

# --- Virtual machine for testing --------------------------------------
VM_RAM_MB="4096"
VM_CPUS="4"
VM_DISK_GB="20"
VM_RESOLUTION="${VM_RESOLUTION:-1920x1080}" # screen size (Full HD); one-off: VM_RESOLUTION=1280x720 scripts/test-vm.sh

# --- Size report -----------------------------------------------------
# The report compares each build with this earlier report (kept in git).
SIZE_BASELINE="reports/size-A3.txt"   # the build before the size cuts
SIZE_BASELINE_NAME="before"

# --- Fixed decisions (notes only, changing them does nothing) ---------
# Base:        Arch Linux, official repos only (AUR only if approved per package)
# Boot:        UEFI only, GRUB (Secure Boot off), systemd
# Interface:   text only (tty); the MangoWM desktop is an optional add-on
# Login:       live ISO logs in as root on tty1 without a password;
#              installed system: root locked, your user may use sudo
# Network:     iwd (Wi-Fi, "iwctl") + systemd-networkd + systemd-resolved
# Disk:        Btrfs, hibernation swap file the size of RAM, zram swap
# Installer:   "monarch-install", plain bash (no dialog, gum or fzf)
# Power:       power-profiles-daemon + monarch power rules + thermald
# Sound:       ALSA drivers + alsa-utils (no sound server yet)
# Developer tools: not included (add later with pacman if needed)

