# =====================================================================
#  mipOS build configuration (Arch Linux edition)
#  One file with every decision. The scripts in scripts/ read it.
#  Format: NAME="value"   (lines starting with # are notes)
#  (A1)...(A4) = the milestone that starts using the setting.
# =====================================================================

# --- Identity --------------------------------------------------------
DISTRO_NAME="mipOS"
DISTRO_ID="mipos"              # lower case, used for file names and the ISO
DISTRO_VERSION="0.3"
DISTRO_URL="https://github.com/CorneliusTantius/mipOS"

# --- Base ------------------------------------------------------------
BASE="archlinux"               # Packages from Arch's official repos (pacman)
ARCH="x86_64"
BOOT_MODE="uefi"               # UEFI only (no old BIOS boot)
AUR="ask-per-package"          # No AUR packages unless approved one by one

# --- Live ISO (A1) ---------------------------------------------------
KERNEL="linux"                 # Arch's stock kernel; trimmed in A2 (NoExtract)
LIVE_HOSTNAME="mipos"
LIVE_LOGIN="root-autologin"    # tty1 logs in as root, no password
# Live system image compression. xz: ~10% smaller ISO, the live system
# starts a bit slower (zstd: faster, bigger). The installed system is not affected.
SQUASHFS_COMPRESSION="xz"
SQUASHFS_LEVEL="19"            # only used with zstd

# --- System (A2/A3) --------------------------------------------------
INIT="systemd"
INTERFACE="tty"                # Text only, no desktop
NETWORK="iwd+networkd+resolved" # iwd (Wi-Fi, "iwctl"), systemd-networkd, systemd-resolved
INSTALLER="mipos-install"      # Plain bash with colored text menus, on the live ISO
INSTALLER_UI="bash"            # No extra UI package (no dialog, gum or fzf)
DEV_TOOLS="no"                 # No gcc/make/python; add later with pacman if needed

# --- Disk (installer, A3/A4) -----------------------------------------
BOOTLOADER="grub"              # GRUB on UEFI, Secure Boot must be OFF
EFI_SIZE_MB="1024"             # EFI partition, mounted at /boot (kernel lives here)
FILESYSTEM="btrfs"
BTRFS_MOUNT_OPTIONS="noatime,compress=zstd:1"
BTRFS_SUBVOLUMES="@ @home @var_log @var_cache @swap"   # no snapshots
ENCRYPTION="ask"               # LUKS2 (argon2id) for root, the installer asks yes/no
INSTALL_TARGET="disk-or-free-space"
HIBERNATE="yes"                # Swap file in @swap, size of RAM
USER_GROUPS="wheel"            # wheel = may use sudo
ROOT_LOCKED="yes"

# --- Lightweight tuning (A2) -----------------------------------------
KERNEL_CMDLINE_EXTRA="quiet loglevel=3 nowatchdog zswap.enabled=0"
LIVE_KERNEL_PARAMS="${KERNEL_CMDLINE_EXTRA}"   # the live ISO uses them too
ZRAM="yes"                     # Compressed swap in RAM (zram-generator)
ZRAM_SIZE_PERCENT="50"
ZRAM_COMPRESSION="zstd"
POWER_MANAGER="power-profiles-daemon" # + mipOS power rules + thermald (TLP needed 74 MiB of perl)
JOURNAL_MAX_SIZE="50M"
SERVICE_STOP_TIMEOUT="10s"

# --- Size (A2) -------------------------------------------------------
STRIP_DOCS="yes"               # pacman NoExtract rules on/off: docs, man, info, translations,
                               # unused firmware and kernel modules
# The rules: archiso/airootfs/etc/pacman.d/mipos-noextract.conf
FIRMWARE="linux-firmware-intel sof-firmware" # Only Intel firmware (graphics, Wi-Fi, Bluetooth, sound)
SOUND="alsa"                   # Sound drivers + alsa-utils (alsamixer); no sound server yet
# Kernel modules to keep when trimming with NoExtract (everything else skipped):
# Modules that must still load after trimming (checked by scripts/25-check-modules.sh):
MUST_HAVE_MODULES="i915 xe snd_hda_intel snd_sof_pci_intel_tgl snd_soc_avs iwlwifi iwlmvm iwlmld btusb btintel bluetooth nvme ahci xhci_pci usb_storage uas usbhid hid_generic i2c_hid_acpi intel_lpss_pci thinkpad_acpi dm_crypt btrfs zram squashfs isofs overlay loop sr_mod vfat ntfs3 exfat virtio_net virtio_blk virtio_gpu virtio_scsi e1000e igc r8169 cfg80211 mac80211 coretemp intel_rapl_msr video battery ac"

# --- Virtual machine for testing --------------------------------------
VM_RAM_MB="4096"
VM_CPUS="4"
VM_DISK_GB="20"

# --- Size report -----------------------------------------------------
# The report compares each build with this earlier report (kept in git).
SIZE_BASELINE="reports/size-A3.txt"   # the build before the size cuts
SIZE_BASELINE_NAME="before"
