# =====================================================================
#  mipOS build configuration (Linux From Scratch edition)
#  One file with every decision. The scripts in scripts/ read it.
#  Format: NAME="value"   (lines starting with # are notes)
# =====================================================================

# --- Identity --------------------------------------------------------
DISTRO_NAME="mipOS"
DISTRO_ID="mipos"
DISTRO_VERSION="0.2"
DISTRO_URL="https://github.com/CorneliusTantius/mipOS"

# --- LFS book --------------------------------------------------------
LFS_VERSION="13.1-systemd"     # The book we follow (systemd edition)
LFS_BOOK_URL="https://www.linuxfromscratch.org/lfs/downloads/stable-systemd"
# All source files for this book version in one place (falls back to each
# project's own website from lfs/book/wget-list if a file is missing here):
LFS_MIRROR="https://ftp.osuosl.org/pub/lfs/lfs-packages/13.1"
LFS="/mnt/lfs"                 # Folder the new system is built in
RUN_TESTS="${RUN_TESTS:-no}"   # yes = run each package's test suite (much slower)

# --- System (later milestones) ---------------------------------------
INIT="systemd"
INTERFACE="tty"                # Text only, no desktop
NETWORK="iwd+networkd"         # iwd (Wi-Fi, "iwctl") + systemd-networkd
INSTALLER="mipos-install"      # Bash + dialog menus, on a live ISO
INSTALLER_UI="dialog"
DELIVERY="live-iso"

# --- Disk (installer) ------------------------------------------------
BOOT_MODE="uefi"
BOOTLOADER="grub"              # Unsigned: Secure Boot must be OFF
FILESYSTEM="btrfs"
BTRFS_MOUNT_OPTIONS="noatime,compress=zstd:1"
BTRFS_SUBVOLUMES="@ @home @var_log @var_cache @swap"   # no snapshots
ENCRYPTION="ask"               # LUKS2, the installer asks yes/no
INSTALL_TARGET="disk-or-free-space"
HIBERNATE="yes"                # Swap file in @swap, size of RAM
USER_GROUPS="wheel audio video input"
ROOT_LOCKED="yes"

# --- Kernel ----------------------------------------------------------
KERNEL_CONFIG="lean-intel-vm"  # Intel PCs/laptops, common USB/storage, QEMU
KERNEL_CMDLINE_EXTRA="quiet loglevel=3 nowatchdog zswap.enabled=0"
# Size: start from "make defconfig", build needed drivers INTO the kernel
# (few or no modules), and switch off everything below.
KERNEL_BUILTIN="i915 xe iwlwifi btintel snd-sof-pci-intel nvme ahci xhci usb-storage uas btrfs dm-crypt virtio-blk virtio-net virtio-gpu r8169"
KERNEL_DISABLE="DEBUG_INFO DEBUG_INFO_BTF IKCONFIG IKHEADERS IA32_EMULATION X86_X32_ABI DRM_AMDGPU DRM_RADEON DRM_NOUVEAU STAGING NFS_FS REISERFS_FS JFS_FS HAMRADIO INFINIBAND"
KERNEL_COMPRESSION="zstd"      # Kernel file and any modules compressed with zstd
MODULE_STRIP="yes"             # INSTALL_MOD_STRIP=1
# Firmware: only the files the built-in drivers above ask for, not whole packages.
FIRMWARE_FOR="i915 xe iwlwifi btintel sof r8169"

# --- Lightweight tuning ----------------------------------------------
ZRAM="yes"                     # Compressed swap in RAM (zramctl, from util-linux)
ZRAM_SIZE_PERCENT="50"
POWER_MANAGER="tlp"
JOURNAL_MAX_SIZE="50M"
STRIP_DOCS="yes"               # Remove docs, man and info pages

# --- Size of the finished system (ISO and installed) ------------------
# Everything is compiled on GitHub, so the finished system doesn't need the
# tools that build programs. They stay in the build stage, not in the ISO.
STRIP_BINARIES="yes"           # LFS 8.85 "Stripping": remove debug data from programs/libraries
RUNTIME_ONLY="yes"             # Leave out compilers, headers and static libraries:
DROP_PATHS="/usr/include /usr/lib/*.a /usr/share/info /usr/share/man /usr/share/doc /usr/share/gtk-doc /usr/share/locale"
DROP_PACKAGES="gcc binutils autoconf automake libtool m4 bison flex texinfo gettext-tools tcl expect dejagnu groff man-db"
KEEP_RUNTIME_LIBS="libgcc_s libstdc++ libatomic libgomp"   # needed by programs, kept even though GCC is dropped
GLIBC_LOCALES="en_US.UTF-8"    # Only this language (all locales = 200+ MB)
SQUASHFS_COMPRESSION="zstd"    # ISO image compression (xz is smaller, zstd boots faster)
SERVICE_STOP_TIMEOUT="10s"

# --- Virtual machine for testing -------------------------------------
VM_RAM_MB="4096"
VM_CPUS="4"
VM_DISK_GB="20"
