# =====================================================================
#  mipOS build configuration
#  This one file holds every decision about the distribution.
#  The scripts in scripts/ read it. Change a value here, rebuild,
#  and the new disk image follows it.
#  Format: NAME="value"  (lines starting with # are notes, not settings)
# =====================================================================

# --- Identity --------------------------------------------------------
DISTRO_NAME="mipOS"            # Name shown to users (boot menu, About screen)
DISTRO_ID="mipos"              # Short lowercase name used in files and folders
DISTRO_VERSION="0.1"           # Our own version number
LIVE_USER="mipos"              # User account on the live disk (no password)
LIVE_HOSTNAME="mipos"          # Computer name on the live disk

# --- Base system -----------------------------------------------------
UBUNTU_VERSION="26.04"         # Ubuntu release we build on
UBUNTU_CODENAME="resolute"     # Ubuntu's code name for 26.04
ARCH="amd64"                   # x86_64 / standard 64-bit PC
MIRROR="http://archive.ubuntu.com/ubuntu/"
SECURITY_MIRROR="http://security.ubuntu.com/ubuntu/"
ARCHIVE_AREAS="main restricted universe multiverse"
KERNEL_FLAVOUR="generic"       # Installs the "linux-generic" kernel package

# --- Locale ----------------------------------------------------------
LOCALE="en_US.UTF-8"
KEYBOARD_LAYOUT="us"
TIMEZONE="UTC"                 # Live disk only; the installer asks the real one

# --- Desktop (milestone M2) ------------------------------------------
DESKTOP="kde-plasma"
SESSION="wayland"
DISPLAY_MANAGER="sddm"         # Login screen

# --- Canonical parts (milestone M3) ----------------------------------
KEEP_SNAP="yes"                # You chose to keep snap (apps and Firefox via snap)
REMOVE_UBUNTU_PRO="yes"        # Remove Ubuntu Pro / Livepatch prompts
REMOVE_TELEMETRY="yes"         # ubuntu-report, ubuntu-insights, apport, whoopsie, popcon
REBRAND="yes"                  # Replace Ubuntu name and logos with mipOS

# --- Installer and disk (milestones M4 and M5) -----------------------
INSTALLER="calamares"
BOOT_MODE="uefi"
BOOTLOADER="grub"              # GRUB first; Limine may be added later as an option
FILESYSTEM="btrfs"
BTRFS_SUBVOLUMES="@ @home @snapshots @var_log @var_cache"
SNAPSHOT_TOOL="snapper"
BOOT_FROM_SNAPSHOT="grub-btrfs"

# --- Look and feel (milestone M6) ------------------------------------
THEME_MODE="dark"              # Dark by default; light can be added later
THEME_SOURCE="custom"          # Our own mipOS theme, built on Breeze
ACCENT_COLOR="graphite"
DOCK="off"                     # Slim top bar only, no dock
ICON_THEME="Papirus-Dark"      # Borrowed open-source icon set
CURSOR_THEME="Breeze_Light"    # Placeholder; picked at M6
FONT="Inter"
WALLPAPER=""                   # Empty = solid dark color until you pick one

# --- Virtual machine for testing -------------------------------------
VM_RAM_MB="4096"
VM_CPUS="4"
VM_DISK_GB="30"                # Used from M4 on (install target)
OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"   # UEFI firmware for the VM
OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

# --- Folders (normally left as they are) -----------------------------
BUILD_DIR="build"              # Working area for live-build (deleted by clean)
OUT_DIR="out"                  # Finished disk images land here
