# =====================================================================
#  mipOS build configuration
#  This one file holds every decision about the distribution.
#  The scripts in scripts/ read it. Change a value here, rebuild,
#  and the new disk image follows it.
#  Format: NAME="value"  (lines starting with # are notes, not settings)
# =====================================================================

# --- Identity --------------------------------------------------------
DISTRO_NAME="mipOS"            # Name shown to users (boot menu, About screen)
DISTRO_ID="mipos"              # Short lowercase name used in files and folders
DISTRO_VERSION="0.1"           # Our own version number
LIVE_USER="mipos"              # User account on the live disk (no password)
LIVE_HOSTNAME="mipos"          # Computer name on the live disk

# --- Base system -----------------------------------------------------
UBUNTU_VERSION="26.04"         # Ubuntu release we build on
UBUNTU_CODENAME="resolute"     # Ubuntu's code name for 26.04
ARCH="amd64"                   # x86_64 / standard 64-bit PC
MIRROR="http://archive.ubuntu.com/ubuntu/"
SECURITY_MIRROR="http://security.ubuntu.com/ubuntu/"
ARCHIVE_AREAS="main restricted universe multiverse"
KERNEL_PACKAGES="linux-image-generic"
                               # The kernel only. ("linux-generic" would also add
                               # ~100 MB of kernel headers, only needed to compile
                               # drivers, which we don't do.)

# --- Locale ----------------------------------------------------------
LOCALE="en_US.UTF-8"
KEYBOARD_LAYOUT="us"
TIMEZONE="UTC"                 # Live disk only; the installer asks the real one

# --- Desktop (milestone M2) ------------------------------------------
DESKTOP="kde-plasma-trimmed"   # Plasma for its monitor handling, with the heavy extras left out
SESSION="wayland"
DISPLAY_MANAGER="greetd"       # Tiny login service
GREETER="tuigreet"             # Dark text login screen (no graphics needed)
# Plasma parts we leave out at M2 (they run in the background and use RAM/battery):
PLASMA_SKIP="baloo akonadi kdeconnect plasma-discover kwallet-pam drkonqi"
# Effects: keep animations, turn off blur and transparency (the costly ones).
PLASMA_EFFECTS="animations-no-blur"

# --- Apps ------------------------------------------------------------
APP_FORMAT="flatpak"           # Flatpak + Flathub (no always-running program). Added at M2.
BROWSER="firefox-mozilla-apt"  # Real Firefox .deb from Mozilla's apt repo. Added at M2.

# --- Canonical parts (milestone M3) ----------------------------------
KEEP_SNAP="no"                 # snap removed (you chose Flatpak instead)
REMOVE_UBUNTU_PRO="yes"        # Remove Ubuntu Pro / Livepatch prompts
REMOVE_TELEMETRY="yes"         # ubuntu-report, ubuntu-insights, apport, whoopsie, popcon
REBRAND="yes"                  # Replace Ubuntu name and logos with mipOS

# Packages apt must never install, even if another package asks for them.
# (An apt "pin" with priority -1 = forbidden.)
BLOCKED_PACKAGES="snapd ubuntu-pro-client ubuntu-advantage-tools ubuntu-report ubuntu-insights apport apport-symptoms whoopsie popularity-contest motd-news-config"

# --- Lightweight / battery settings ----------------------------------
# Firmware = small files that chips (Wi-Fi, graphics, sound) need at startup.
# Common laptop/desktop chips only. Server cards, NVIDIA, Broadcom and
# ARM-laptop (Snapdragon) firmware are left out: ~250 MB instead of ~620 MB.
# If a device doesn't work later, add its linux-firmware-* package back here.
FIRMWARE_PACKAGES="linux-firmware-minimal linux-firmware-intel-graphics linux-firmware-intel-wireless linux-firmware-intel-misc firmware-sof-signed linux-firmware-realtek linux-firmware-mediatek linux-firmware-qualcomm-wireless linux-firmware-amd-graphics"

# Strip files nobody reads on this system (saves disk space).
# Copyright files are always kept (required when sharing a distribution).
STRIP_DOCS="yes"               # /usr/share/doc (except copyright files)
STRIP_MAN="yes"                # man pages and info pages
STRIP_LOCALES="yes"            # translations for languages other than English
KEEP_LOCALES="en en_US"

# Power: TLP tunes CPU, Wi-Fi, USB and disk power; thermald manages Intel heat.
POWER_MANAGER="tlp"
THERMAL_DAEMON="thermald"

# Memory: zram = compressed swap kept in RAM. Much faster than swap on disk,
# and lets low-RAM machines run more without slowing down.
ZRAM="yes"
ZRAM_SIZE="ram / 2"            # Up to half the RAM, compressed (zstd)

# D-Bus = the message system programs use to talk to each other.
# dbus-broker is a faster, lighter replacement for the standard one.
DBUS_BROKER="yes"

# System log: cap its size so it never grows big.
JOURNAL_MAX_SIZE="50M"

# Background services/timers to switch off (they wake the PC or slow boot).
# apt-daily*: checks for updates twice a day. Off = you update by hand
#   with "sudo apt update && sudo apt upgrade" (do this weekly).
# NetworkManager-wait-online: makes boot wait for the network.
DISABLED_UNITS="apt-daily.timer apt-daily-upgrade.timer man-db.timer motd-news.timer e2scrub_all.timer NetworkManager-wait-online.service"

# Extra kernel options:
#   nowatchdog      = turn off a debug timer that wakes the CPU (saves battery)
#   zswap.enabled=0 = we use zram instead
#   loglevel=3      = fewer messages during boot
KERNEL_CMDLINE_EXTRA="quiet loglevel=3 nowatchdog zswap.enabled=0"

# Faster shutdown: don't wait more than 10 s for a stuck program.
SERVICE_STOP_TIMEOUT="10s"

# --- Installer and disk (milestones M4 and M5) -----------------------
INSTALLER="mipos-install"      # Our own text-menu installer (bash + gum), runs on the live disk
INSTALLER_UI="gum"             # gum = pretty terminal menus (same tool Omarchy uses)
INSTALL_TARGET="disk-or-free-space"  # Erase a whole disk, or use free space next to Windows (dual boot)
ENCRYPTION="ask"               # LUKS2 full-disk encryption: the installer asks yes/no
DUAL_BOOT_MENU="os-prober"     # Finds Windows so GRUB can list it
BOOT_MODE="uefi"
BOOTLOADER="grub"              # GRUB first; Limine may be added later as an option
FILESYSTEM="btrfs"
BTRFS_MOUNT_OPTIONS="noatime,compress=zstd:1"   # noatime = fewer disk writes; light compression
BTRFS_SUBVOLUMES="@ @home @snapshots @var_log @var_cache @swap"
HIBERNATE="yes"                # Swap file (size of RAM) in @swap, used only for hibernation;
                               # zram stays the everyday swap (higher priority).
                               # Note: Ubuntu's kernel blocks hibernation while Secure Boot is on.
SNAPSHOT_TOOL="snapper"
BOOT_FROM_SNAPSHOT="grub-btrfs"
INITRAMFS_MODULES="dep"        # Installed system: initrd holds only drivers this PC needs

# --- Look and feel (milestone M6) ------------------------------------
THEME_MODE="dark"              # Dark by default; light can be added later
THEME_SOURCE="custom"          # Our own mipOS theme, built on Breeze
ACCENT_COLOR="graphite"
DOCK="off"                     # Slim top bar only, no dock
ICON_THEME="Papirus-Dark"      # Borrowed open-source icon set
CURSOR_THEME="Breeze_Light"    # Placeholder; picked at M6
FONT="Inter"
WALLPAPER=""                   # Empty = solid dark color until you pick one

# --- Virtual machine for testing -------------------------------------
VM_RAM_MB="4096"
VM_CPUS="4"
VM_DISK_GB="30"                # Used from M4 on (install target)
OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"   # UEFI firmware for the VM
OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

# --- Folders (normally left as they are) -----------------------------
BUILD_DIR="build"              # Working area for live-build (deleted by clean)
OUT_DIR="out"                  # Finished disk images land here
