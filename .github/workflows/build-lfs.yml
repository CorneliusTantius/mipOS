# Builds mipOS from source (Linux From Scratch) on GitHub's servers.
#
# Only runs when you start it: Actions tab -> "Build LFS" -> "Run workflow"
# -> pick the branch under "Use workflow from" -> Run.
#
# Two jobs, one after the other (each may run up to 6 hours):
#   L1  temporary system, LFS chapters 4-7      -> download "l1-temp-system"
#   L2  final system + lean kernel, chapters 8-10, then the slim runtime
#       image and a size report                  -> download "mipos-runtime"
# The size report is also shown on the run's summary page.

name: Build LFS

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run each package's test suite (much slower)"
        type: boolean
        default: false

concurrency:
  group: build-lfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-temp-system:
    name: "L1: temporary system (chapters 4-7)"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUN_TESTS: ${{ inputs.run_tests && 'yes' || 'no' }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Free disk space on the build server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Source files only change with the book version, so keep them between runs.
      - name: Prepare the sources folder
        run: sudo mkdir -p /mnt/lfs/sources && sudo chmod 1777 /mnt/lfs/sources
      - name: Reuse downloaded sources
        uses: actions/cache@v4
        with:
          path: /mnt/lfs/sources
          key: lfs-sources-${{ hashFiles('lfs/book/md5sums') }}

      - name: Install build tools (chapter 2)
        run: sudo scripts/00-host-tools.sh --change-bin-sh
      - name: Check the build computer (chapter 2.2)
        run: scripts/01-host-check.sh
      - name: Download sources, create user and layout (chapters 3-4)
        run: sudo -E scripts/10-prepare.sh
      - name: Cross-toolchain (chapter 5)
        run: sudo -E scripts/20-cross-toolchain.sh
      - name: Temporary tools (chapter 6)
        run: sudo -E scripts/21-temp-tools.sh
      - name: Chroot and last temporary tools (chapter 7)
        run: sudo -E scripts/30-chroot-tools.sh
      - name: Save the temporary system
        run: |
          sudo scripts/save-stage.sh l1-temp-system
          sudo chown -R "$(id -u):$(id -g)" out

      - name: Upload the temporary system
        uses: actions/upload-artifact@v4
        with:
          name: l1-temp-system
          path: out/l1-temp-system.tar.zst
          retention-days: 7
          compression-level: 0

      - name: Upload build logs (also when the build fails)
        if: always()
        run: |
          mkdir -p logs
          sudo cp -r /mnt/lfs/.mipos-logs/. logs/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-logs
          path: logs/
          if-no-files-found: ignore

  l2-system:
    name: "L2: final system, kernel, slim image (chapters 8-10)"
    needs: l1-temp-system
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUN_TESTS: ${{ inputs.run_tests && 'yes' || 'no' }}
    steps:
      - name: Get the project files
        uses: actions/checkout@v4
      - name: Free disk space on the build server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Install build tools
        run: sudo scripts/00-host-tools.sh --change-bin-sh

      - name: Get the temporary system from L1
        uses: actions/download-artifact@v4
        with:
          name: l1-temp-system
          path: out
      - name: Restore it into /mnt/lfs
        run: |
          sudo scripts/save-stage.sh --load out/l1-temp-system.tar.zst
          rm -f out/l1-temp-system.tar.zst

      - name: Final system, configuration and kernel (chapters 8-10)
        run: sudo -E scripts/40-system.sh
      - name: Slim runtime image and size report
        run: |
          sudo scripts/50-runtime-image.sh
          sudo chown -R "$(id -u):$(id -g)" out
          { echo '## mipOS size report'; echo '```'; cat out/size-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the runtime image
        uses: actions/upload-artifact@v4
        with:
          name: mipos-runtime
          path: |
            out/mipos-rootfs.squashfs
            out/vmlinuz
            out/kernel-config
            out/size-report.txt
          retention-days: 14
          compression-level: 0

      - name: Save the full build for the next milestone
        run: |
          sudo scripts/save-stage.sh l2-full-system
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: l2-full-system
          path: out/l2-full-system.tar.zst
          retention-days: 7
          compression-level: 0

      - name: Collect build logs and file lists (also when the build fails)
        if: always()
        run: |
          mkdir -p logs/files
          sudo cp -r /mnt/lfs/.mipos-logs/. logs/ 2>/dev/null || true
          sudo cp -r /mnt/lfs/.mipos-files/. logs/files/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-logs
          path: logs/
          if-no-files-found: ignore
