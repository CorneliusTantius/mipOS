# Builds the mipOS disk image (.iso) on GitHub's servers.
#
# When it runs: only when you start it.
#   Actions tab -> "Build ISO" -> "Run workflow" -> pick the branch under
#   "Use workflow from" -> optionally tick "Publish a GitHub Release" -> Run.
#
# Where to get the image: open the finished run in the Actions tab and
# download "mipos-iso" at the bottom (kept for 14 days), or from Releases.
#
# Why Docker: the build must run on Ubuntu 26.04 (the same release we build),
# and live-build needs full system rights (--privileged) to create the system.

name: Build ISO

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the ISO"
        type: boolean
        default: false
      version:
        description: "Release version tag (only used when publishing), e.g. v0.1"
        type: string
        default: ""

# A newer push cancels an older build of the same branch.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed only to publish Releases for tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Free disk space on the build server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build the ISO inside Ubuntu 26.04
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:26.04 \
            bash -c "scripts/01-install-host-tools.sh --build-only && scripts/build-all.sh"

      - name: Add a checksum file
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS && ls -lh

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: mipos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 14
          compression-level: 0   # the ISO is already compressed

      - name: Upload the build log (also when the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build-rootfs.log
          if-no-files-found: ignore

      - name: Publish a Release (only if ticked)
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [ -n "$VERSION" ] || { echo "Fill in the version (e.g. v0.1) to publish a release."; exit 1; }
          # Creates the tag on the exact commit that was built.
          gh release create "$VERSION" out/*.iso out/SHA256SUMS \
            --target "$GITHUB_SHA" --title "mipOS $VERSION" --generate-notes
