# pacman settings used while building the ISO.
[options]
HoldPkg      = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional

# Size trimming, filled in from airootfs/etc/pacman.d/monarch-noextract.conf
@NOEXTRACT@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
