# =====================================================================
#  monarch desktop: MangoWM settings (Nothing-style: black, white, one red accent)
#  Copied to ~/.config/mango/config.conf by monarch-add-desktop (only if you
#  have none). Edit your copy freely; reload with Super+R.
#  All options: https://mangowm.github.io/docs/
#  Colors are 0xRRGGBBAA. Accent red = 0xd71921ff.
# =====================================================================

# Start the bar with the desktop
exec_once=waybar
exec_once=mako
exec_once=udiskie

# Monitor positions chosen from the Waybar monitor pill (see monitor-layout.sh)
source_optional=~/.config/mango/monitor.conf

# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows=0
layer_shadows=0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=14
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000066

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=fade
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
animation_duration_move=280
animation_duration_open=240
animation_duration_tag=260
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.22,1,0.36,1
animation_curve_move=0.22,1,0.36,1
animation_curve_tag=0.22,1,0.36,1
animation_curve_close=0.4,0,0.6,1
animation_curve_focus=0.22,1,0.36,1
animation_curve_opacity_fade_out=0.4,0,0.6,1
animation_curve_opacity_fade_in=0.22,1,0.36,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=1
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=14
gap_outer_vertical=14
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x000000ff
border_color=0x1f1f1fff
drop_color=0xd7192155
split_color=0xd71921ff
focus_color=0xd71921ff
maximized_screen_color=0x8c8c8cff
urgent_color=0xffffffff
scratchpad_color=0x8c8c8cff
global_color=0xd71921ff
overlay_color=0x8c8c8cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload mango, mako and waybar (fuzzel reads its config on each launch)
bind=SUPER,r,spawn_shell,mmsg dispatch reload_config; makoctl reload; pkill -SIGUSR2 waybar

# launcher (Ctrl+Space or Super+Space) and terminal (Super+Enter)
bind=CTRL,space,spawn,fuzzel
bind=SUPER,space,spawn,fuzzel
bind=SUPER,Return,spawn,foot

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus (arrows or h/j/k/l)
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# move window (arrows or h/j/k/l)
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,viewtoright,0
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch (workspace) with Alt+arrows or Alt+h/l
bind=ALT,Left,viewtoleft,0
bind=ALT,Right,viewtoright,0
bind=ALT,h,viewtoleft,0
bind=ALT,l,viewtoright,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ThinkPad keys: brightness, volume, mute, microphone mute
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screenshots: Print = pick an area, copy it to the clipboard
#              Shift+Print = pick an area, save it as ~/screenshot-DATE.png
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" ~/screenshot-$(date +%F-%H%M%S).png

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# Small floating window for the bar's volume, Wi-Fi and Bluetooth apps
window_rule=is_floating:1,width:0.5,height:0.65,app_id:monarch-popup

# layer rule
layer_rule=animation_type_open:fade,layer_name:launcher
layer_rule=animation_type_close:fade,layer_name:launcher
