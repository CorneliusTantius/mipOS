# mipOS size trimming: files pacman should NOT unpack ("NoExtract").
# Used while building the ISO, and copied to installed systems.
# Rules: shell patterns; a line starting with ! brings files back;
# a later rule wins over an earlier one.
# To get something back: delete or "!"-negate its line, then reinstall the
# package (pacman -S <package>).

[options]
# --- Documentation, man/info pages, translations -----------------------
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/* usr/share/help/*
NoExtract = usr/share/locale/* !usr/share/locale/locale.alias

# --- Developer files: C headers and static libraries -------------------
# Only needed to compile programs (mipOS has no compiler by default).
# Want to compile later? Delete these two lines, then reinstall packages:
#   sudo pacman -S $(pacman -Qq)
NoExtract = usr/include/*
NoExtract = usr/lib/*.a

# --- binutils: mipOS only needs what mkinitcpio uses (ld, objcopy,
# objdump, size, strip). Leave out the gold linker, assembler, profilers.
NoExtract = usr/bin/ld.gold usr/bin/dwp usr/bin/as usr/bin/gprof usr/bin/gprofng*
NoExtract = usr/lib/gprofng/* usr/lib/libgprofng*

# --- Terminal descriptions: only common ones (text console, xterm-style,
# tmux/screen, foot, alacritty, kitty, vt100)
NoExtract = usr/share/terminfo/*
NoExtract = !usr/share/terminfo/l/linux* !usr/share/terminfo/x/xterm* !usr/share/terminfo/v/vt100* !usr/share/terminfo/v/vt220*
NoExtract = !usr/share/terminfo/s/screen* !usr/share/terminfo/t/tmux* !usr/share/terminfo/f/foot* !usr/share/terminfo/a/alacritty*
NoExtract = !usr/share/terminfo/d/dumb
# Some kept entries are stored as hard links to these files, so keep them too
# (otherwise pacman warns "Hard-link target ... does not exist").
NoExtract = !usr/share/terminfo/v/vt200* !usr/share/terminfo/v/v200-nam !usr/share/terminfo/v/vs100 !usr/share/terminfo/v/vscode
NoExtract = !usr/share/terminfo/m/ms-vt100+ !usr/share/terminfo/n/news !usr/share/terminfo/n/nxterm

# --- GRUB: only the UEFI (x86_64-efi) parts; mipOS doesn't boot old BIOS --
NoExtract = usr/lib/grub/* !usr/lib/grub/x86_64-efi/*

# Kernel drivers and firmware are not trimmed here: mipOS keeps only this
# laptop's, using the lists /etc/mipos/keep-modules and keep-firmware
# (see /usr/local/sbin/mipos-trim-hardware).
